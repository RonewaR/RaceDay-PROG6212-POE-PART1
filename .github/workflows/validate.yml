name: RaceDay Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required files
        run: |
          echo "Checking RaceDay assignment files..."

          test -f "API ENDPOINT PLAN.PDF"
          test -f "RACEDAY. SQL"
          test -f "RACEDAY ERD.jpg"

          echo "All required RaceDay files are present."

      - name: Validation successful
        run: echo "RaceDay validation passed successfully!"
