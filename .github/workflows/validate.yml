name: RaceDay Repository Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required files
        shell: bash
        run: |
          echo "Checking RaceDay repository structure..."

          test -d docs
          test -f docs/ERD.png
          test -f docs/API_Endpoint_Plan.md
          test -f docs/RaceDayDB.sql
          test -f README.md

          echo "All required files are present."
          echo "RaceDay repository validation successful."
